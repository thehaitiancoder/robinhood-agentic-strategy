prompt = "Hard time gate first, before reading docs or calling Robinhood: check current Pacific time. This 17:00 PT - RH DAILY job is read-only reporting plus end-of-day reconciliation. If this run starts before 17:00 PT, write a concise early-start skip to automation memory if possible, do not query Robinhood, and stop. If it starts at or after 17:00 PT, summarize the current Pacific date.\n\nIf the time gate passes, run `python -m agentic_strategy.market_calendar --date today --calendar config/market-holidays.csv --market US_EQUITIES`; if it reports `market_status=closed`, write `MARKET HOLIDAY SKIP` with the reported date and description to automation memory if possible, do not query Robinhood, do not place/review orders, do not write trading/cache state, and stop.\n\nStart the first visible response with `MM-DD 17:00 PT - RH DAILY`. Use only the Agentic Robinhood account. Broker data is source of truth. Read AGENTS.md and docs/automation-monitor.md after the time gate.\n\nThis automation is reporting and local reconciliation only. Do not call broker order review, placement, or cancellation tools. Do not place, review, cancel, prepare, or suggest buy, sell, reopen, double-down, emergency-cash, or opening orders. Do not regenerate deprecated LIVE_STATE.md. Do not reset or clear data/private/sold-today.md; if broker evidence requires a sold-today reconciliation, preserve older pending-reopen rows and follow docs/sold-today.md.\n\nFetch fresh broker truth for the Agentic account: portfolio, positions with quotes, open/recent orders, queued orders, all filled equity orders, cancellations, rejections, buying power, and cash. Use the repo read-only helpers where possible: `node scripts/rh_fast.mjs portfolio --account 878067701 --output data/runtime/daily-summary-portfolio.json`, `node scripts/rh_fast.mjs positions --account 878067701 --with-quotes --output data/runtime/daily-summary-positions-quotes.json --summary-output data/runtime/daily-summary-positions.csv`, and `node scripts/rh_fast.mjs orders --account 878067701 --all --output data/runtime/daily-summary-orders-all.json`.\n\nPerform the former close reconciliation here, after fresh broker fetches: import broker order history, fills, cancellations, rejections, and known skipped-action reasons into data/private/order-ledger.csv; generate data/private/current-symbols.json; generate data/private/close-summary.md; generate data/private/top-10-buy-candidates.md; and generate data/private/top-10-sell-candidates.md. These are local audit/cache writes only and are not trading authority.\n\nGenerate the performance report and update the private performance history with `python -m agentic_strategy.daily_summary --portfolio-json data/runtime/daily-summary-portfolio.json --positions-json data/runtime/daily-summary-positions-quotes.json --orders-json data/runtime/daily-summary-orders-all.json --output-md data/private/daily-summary.md --cycles-csv data/private/daily-return-cycles.csv --output-json data/private/daily-summary.json --history-csv data/private/performance-history.csv --history-md data/private/performance-history.md`. The history writer keeps one row per Pacific date and replaces that row on rerun instead of duplicating it.\n\nValidate top downside holdings as next-session DD watch candidates only if full coverage is available from the read-only data. If DD coverage cannot be completed, mark DD SCAN BLOCKED, email rdgustave@gmail.com with subject DOUBLE-DOWN SCAN BLOCKED - Robinhood strategy, and include exact blockers and verified/unverified symbols. Do not review or place any order for a candidate found by this daily job.\n\nReport a concise summary in the thread: account value, cash, buying power, gross paper gain, gross paper loss, net paper P/L, realized profit for the Pacific trading day, sell count, profit by hour, average/median time from first buy to sell, any uncosted sold quantity that means order history was incomplete, and the reconciliation/performance artifacts written, including data/private/performance-history.md and data/private/performance-history.csv. Email routine no-action summaries only if reconciliation/cache/ledger/report generation fails, broker access fails, DD scan coverage is blocked, or a high-priority next-session candidate needs attention."
