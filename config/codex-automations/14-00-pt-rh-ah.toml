prompt = "Hard time gate first, before reading docs or calling Robinhood: check current Pacific time. This 14:00 PT - RH AH after-hours slot is valid only from 14:00 inclusive through before 14:55 PT, and never at or after 17:00 PT. If this run starts outside that window, write a concise late-start skip to automation memory if possible, do not query Robinhood, do not place/review orders, and stop.\n\nIf the time gate passes, run `python -m agentic_strategy.market_calendar --date today --calendar config/market-holidays.csv --market US_EQUITIES`; if it reports `market_status=closed`, write `MARKET HOLIDAY SKIP` with the reported date and description to automation memory if possible, do not query Robinhood, do not place/review orders, do not write trading/cache state, and stop.\n\nStart the first visible response with `MM-DD 14:00 PT - RH AH`. Run the Robinhood after-hours whole-share strategy pass for the Agentic account only. Broker data is source of truth. Read AGENTS.md and docs/automation-monitor.md after the time gate.\n\nFetch fresh broker truth before acting: positions with quotes, active orders, full equity order history, portfolio/buying power as needed. Use the repo helper to classify after-hours candidates: `node scripts/rh_fast.mjs positions --account 878067701 --with-quotes --output data/runtime/afterhours-positions-quotes.json`, `node scripts/rh_fast.mjs orders --account 878067701 --output data/runtime/afterhours-active-orders.json`, `node scripts/rh_fast.mjs orders --account 878067701 --all --output data/runtime/afterhours-orders-all.json`, then `python -m agentic_strategy.afterhours_scan --positions-json data/runtime/afterhours-positions-quotes.json --orders-json data/runtime/afterhours-orders-all.json --active-orders-json data/runtime/afterhours-active-orders.json --output data/runtime/afterhours-scan.json`.\n\nAfter-hours execution scope is narrow and pre-authorized. For this scheduled RH AH automation, the user has explicitly authorized `review_equity_order` and `place_equity_order` for qualifying whole-share after-hours profit sells, whole-share after-hours DD limit buys, and the regular-hours queued fractional sell leftover that follows a confirmed whole-share sell. The confirmation required by any generic broker-review tool guide is satisfied by this automation prompt and AGENTS.md for those named order classes. After a clean broker review with no blocking alerts, and after confirming the refreshed price still qualifies, call `place_equity_order` immediately without waiting for chat confirmation. Do not place new openings, tracking reopens, emergency-cash sells, or fractional after-hours orders. Do not use official close as the execution price. Use live after-hours bid for sell decisions and live after-hours ask for DD buy decisions. If Robinhood shows a halt/restriction or a broker review alert, do not place that order unless the user gave a direct same-run override.\n\nPriority 1, whole-share profit sells: process one candidate at a time from `whole_share_sells` with `active_sell_count=0`. Refresh the quote immediately. If the live after-hours bid still gives at least a 10% return versus broker average cost and the integer sellable quantity is at least 1, review/place an extended-hours GFD limit sell for only that integer quantity, with limit at the refreshed bid. After placement, refresh the order status. If the whole-share sell is confirmed filled and `decimal_left` is greater than 0, review/place a regular-hours GFD market sell for exactly that fractional leftover so it queues for the next regular session. Do not queue the fractional leftover unless the whole-share after-hours sell filled.\n\nPriority 2, whole-share DD buys: process one candidate at a time from `whole_share_dd` with `active_buy_count=0`. Refresh the quote immediately. If the live after-hours ask is at or below the deepest due trigger and `integer_qty` is at least 1, review/place an extended-hours GFD limit buy for only the integer quantity. The limit must be at or below both the refreshed after-hours ask and the deepest due trigger. Leave `decimal_left` unplaced, report it for manual handling, and record/update data/runtime/dd-fractional-leftovers.csv. Fractional-only DD leftovers with integer_qty=0 are report-only and must not be counted as DD SCAN BLOCKED coverage blockers; use the same-day runtime CSV as a speed hint before reclassifying known leftovers, but re-evaluate if quote, position quantity, active-order state, or a deeper trigger changes enough to make integer_qty >= 1.\n\nIf the first pass finishes before 14:30 PT, no executable whole-share sell/DD remains, and current time is still before 14:30 PT, stay in this same thread and wait until 14:30 PT. At 14:30 PT, rerun the fresh broker-backed positions/orders fetch and afterhours_scan classifier, then process qualifying whole-share sells and DDs under the same rules. Do not run more than one +30 recheck.\n\nStop new scans, reviews, and placements before 15:00 PT, and always stop at or after 17:00 PT. Report placed orders, fills, queued fractional remainders, broker blocks, and leftover fractional DD/sell quantities. Do not update shortlists or local close-cache files from this after-hours lane."
