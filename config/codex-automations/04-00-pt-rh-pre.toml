prompt = "Hard time gate first, before reading docs or calling Robinhood: check current Pacific time. This 04:00 PT - RH PRE premarket slot is valid only from 04:00 inclusive through before 04:55 PT, and never at or after 06:30 PT. If this run starts outside that window, write a concise late-start skip to automation memory if possible, do not query Robinhood, do not place/review orders, and stop.\n\nIf the time gate passes, run `python -m agentic_strategy.market_calendar --date today --calendar config/market-holidays.csv --market US_EQUITIES`; if it reports `market_status=closed`, write `MARKET HOLIDAY SKIP` with the reported date and description to automation memory if possible, do not query Robinhood, do not place/review orders, do not write trading/cache state, and stop.\n\nStart the first visible response with `MM-DD 04:00 PT - RH PRE`. Run the Robinhood premarket whole-share strategy pass for the Agentic account only. Broker data is source of truth. Read AGENTS.md and docs/automation-monitor.md after the time gate.\n\nFetch fresh broker truth before acting: positions with quotes, active orders, full equity order history, portfolio/buying power as needed. Use the repo helper to classify premarket candidates: `node scripts/rh_fast.mjs positions --account 878067701 --with-quotes --output data/runtime/premarket-positions-quotes.json`, `node scripts/rh_fast.mjs orders --account 878067701 --output data/runtime/premarket-active-orders.json`, `node scripts/rh_fast.mjs orders --account 878067701 --all --output data/runtime/premarket-orders-all.json`, then `python -m agentic_strategy.afterhours_scan --positions-json data/runtime/premarket-positions-quotes.json --orders-json data/runtime/premarket-orders-all.json --active-orders-json data/runtime/premarket-active-orders.json --output data/runtime/premarket-scan.json`.\n\nExtended-hours execution scope is narrow and pre-authorized. Do not place new openings, tracking reopens, emergency-cash sells, or fractional extended-hours orders. Do not use official close as the execution price. Use live premarket bid for sell decisions and live premarket ask for DD buy decisions. If Robinhood shows a halt/restriction or a broker review alert, do not place that order unless the user gave a direct same-run override.\n\nPriority 1, whole-share profit sells: process one candidate at a time from `whole_share_sells` with `active_sell_count=0`. Refresh the quote immediately. If the live premarket bid still gives at least a 10% return versus broker average cost and the integer sellable quantity is at least 1, review/place an extended-hours GFD limit sell for only that integer quantity, with limit at the refreshed bid. After placement, refresh the order status. If the whole-share sell is confirmed filled and `decimal_left` is greater than 0, review/place a regular-hours GFD market sell for exactly that fractional leftover so it queues for the next regular session. Do not queue the fractional leftover unless the whole-share extended-hours sell filled.\n\nPriority 2, whole-share DD buys: process one candidate at a time from `whole_share_dd` with `active_buy_count=0`. Refresh the quote immediately. If the live premarket ask is at or below the deepest due trigger and `integer_qty` is at least 1, review/place an extended-hours GFD limit buy for only the integer quantity. The limit must be at or below both the refreshed premarket ask and the deepest due trigger. Leave `decimal_left` unplaced and report it for manual handling.\n\nIf the first pass finishes before 04:30 PT, no executable whole-share sell/DD remains, and current time is still before 04:30 PT, stay in this same thread and wait until 04:30 PT. At 04:30 PT, rerun the fresh broker-backed positions/orders fetch and afterhours_scan classifier, then process qualifying whole-share sells and DDs under the same rules. Do not run more than one +30 recheck.\n\nStop new scans, reviews, and placements before 05:00 PT, and always stop before 06:30 PT. Report placed orders, fills, queued fractional remainders, broker blocks, and leftover fractional DD/sell quantities. Do not update shortlists or local close-cache files from this premarket lane."
