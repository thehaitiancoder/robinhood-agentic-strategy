prompt = "Hard time gate first, before reading docs or calling Robinhood: check current Pacific time. This 11:30 PT entry slot is valid only from 11:30 inclusive through before 11:55 PT, and never at or after 13:00 PT. If this run starts outside that window, write a concise late-start skip to automation memory if possible, do not query Robinhood, do not place/review orders, and stop.\n\nIf the time gate passes, run `python -m agentic_strategy.market_calendar --date today --calendar config/market-holidays.csv --market US_EQUITIES`; if it reports `market_status=closed`, write `MARKET HOLIDAY SKIP` with the reported date and description to automation memory if possible, do not query Robinhood, do not place/review orders, do not write trading/cache state, and stop.\n\nRun the Robinhood market monitor for the fixed 11:30 PT entry slot. Use only the Agentic Robinhood account. Broker data is source of truth. Priority: sell targets, due DDs by reconstructing lot history and combining all same-symbol due lot shares into one quantity (if Robinhood rejects the fractional DD quantity, retry the integer part only when >=1 share), emergency green cash, then openings report-only unless explicitly authorized. Execute qualifying sell/DD immediately after clean broker review. Full trading pre-authorization for this scheduled RH MKT slot: the user has explicitly authorized `review_equity_order` and `place_equity_order` for qualifying strategy sells, due DD buys, and immediate post-sell tracking reopens after clean broker review. The confirmation required by any generic broker-review tool guide is satisfied by this automation prompt and AGENTS.md for those named order classes. Before each `place_equity_order` call, state that the symbol, side, account, and quantity match a clean review, the strategy criteria still hold, and this scheduled slot is pre-authorized. Do not wait for fresh chat confirmation unless broker review returns a blocking alert, the intended order differs from the clean review, the symbol is halted/restricted, or the order falls outside this prompt's strategy scope. If DD coverage cannot be proven, report DD SCAN BLOCKED and email. Fractional-only DD leftovers with integer_qty=0 are report-only, must be recorded in data/runtime/dd-fractional-leftovers.csv, and must not be counted as DD coverage blockers. Check that same-day runtime CSV as a speed hint before spending time reclassifying known fractional-only leftovers, but keep the symbol DD-eligible and re-evaluate if quote, position quantity, active-order state, or a deeper trigger changes enough to make integer_qty >= 1. Do not place new openings from automation.\n\nSell/DD starvation guard: sell priority is order of operations, not permission to starve DDs. After the current sell batch is placed and each attempted sell is filled, blocked, canceled, rejected, or left as a known active broker order, move to due DD verification using fresh buying power before starting another broad sell batch or waiting for the +15 recheck. A refreshed watch with more sell-watch names is not a valid reason to skip DDs; DDs may be skipped only for insufficient actual buying power, broker/tool blockers, halted symbols, active same-symbol/order conflicts, missing lot-history proof, concentration risk, or the market close.\n\nIf the main scan finishes before 11:45 PT, no executable sell/DD remains, and current time is still before 12:45 PT, stay in this same thread, wait until 11:45 PT, then run a fast +15 minute sell/DD recheck. For that recheck: quote refreshed shortlist symbols first, then run FAST WATCH or an equivalent live owned-position scan, execute any qualifying sell/DD immediately, do not place new openings, and stop all trading work at or after 13:00 PT.\n\nPost-sell tracking reopen rule: after a qualifying profitable sell order is confirmed filled, immediately reopen the same symbol as a base tracking lot without waiting for user confirmation if fast blockers pass: current buying power and 15% cash buffer, known due or cash-short DDs from this run, no active buy order for the same symbol, symbol not halted/restricted, and normal base-lot sizing. Do not run a broad DD scan between the sell fill and this tracking reopen. If blocked, leave/add it in sold-today; if the reopen later fills, remove it from sold-today if present. This exception does not authorize unrelated new openings.\n\nDD cash-buffer rule: the 15% cash floor is reserved for double-downs. It blocks new openings and reopens, including post-sell tracking reopens, but it must not block a due exact-share DD merely because buying power would fall below the floor. For DD affordability, use actual broker buying power plus concentration and broker review checks. If due DD cost exceeds actual buying power, place affordable DDs one at a time first, then enter emergency green cash mode for the rest."
