prompt = '''
Hard time gate first, before reading docs or calling Robinhood: check current Pacific time. This 11:00 PT entry slot is valid only from 11:00 inclusive through before 11:25 PT, and never at or after 13:00 PT. If this run starts outside that window, write a concise late-start skip to automation memory if possible, do not query Robinhood, do not place/review orders, and stop.

If the time gate passes, run `python -m agentic_strategy.market_calendar --date today --calendar config/market-holidays.csv --market US_EQUITIES`; if it reports `market_status=closed`, write `MARKET HOLIDAY SKIP` with the reported date and description to automation memory if possible, do not query Robinhood, do not place/review orders, do not write trading/cache state, and stop.

Start the first visible response with `MM-DD 11:00 PT - RH MKT`. Use only Agentic account `878067701`. Broker data is source of truth. Read `AGENTS.md` and `docs/automation-monitor.md` after the gates. For handoff context, read the immediately preceding automation memory `C:\Users\ralph\.codex\automations\10-30-pt-rh-mkt\memory.md` if present and same-day; do not use this 11:00 slot's previous-day memory as the current handoff. This slot's memory may be read only for recurring slot-specific blockers after the previous-lane handoff.

Record `launch_time` immediately after the gates pass. This slot has two strict run-clock lanes:
- Lane 1, `launch_time` through `launch_time + 14:59`: sell and immediate tracking reopen first.
- Lane 2, `launch_time + 15:00` through `launch_time + 30:00`: DD first.
At each lane boundary, stop starting new reviews/placements for the old lane and switch to the new lane. At `launch_time + 30:00`, or at/after 13:00 PT, stop starting broker reviews/placements except status checks for already placed orders, required emails, and memory/handoff writes.

Standing authorization: this scheduled RH MKT slot is pre-authorized to review and place qualifying strategy sells, due DD buys, and immediate post-sell tracking reopens after clean broker review. The generic broker-review confirmation requirement is satisfied by this prompt and `AGENTS.md` for those order classes. Before each `place_equity_order` call, state that the symbol, side, account, and quantity match a clean review, the strategy criteria still hold, and this scheduled slot is pre-authorized. Do not wait for chat confirmation unless review returns a blocking alert, the intended order differs from review, the symbol is halted/restricted, or the order is outside this strategy scope. Do not place new openings.

Email policy: send email only when an action is blocked or an issue needs user attention, such as broker-blocked sell/DD attempts, DD SCAN BLOCKED, guard exceptions, broker/tool failures, or high-priority next-session warnings. Do not email for successful sells, successful DD fills, successful reopens, routine fills, or routine no-action; record successful orders in the thread and automation memory only.

Lane 1 sell/reopen procedure: read `data/private/top-10-sell-candidates.md` first and quote those symbols against live Robinhood data. Refresh positions, active orders, and quotes enough to know sellable quantity and bid-side return. Review/place each qualifying sell immediately, one symbol at a time, then poll until it is filled, blocked, rejected, canceled, or a known active broker order. After a confirmed profitable sell fill, immediately attempt the base tracking reopen if fast blockers pass: buying power and 15% cash buffer, symbol policy permits reopen, no known due or cash-short DD from this run, no active buy order for the same symbol, not halted/restricted, and normal base-lot sizing. If reopen is blocked, append or leave the symbol in `data/private/sold-today.md` with the blocker; if filled, remove it from that queue.

Continue selling during Lane 1 until there are no qualifying sell candidates left or Lane 1 time expires. `No qualifying sell candidates left` means the sell shortlist has been exhausted and a fresh broker-backed sell scan, or a fully processed live sell-watch list, shows no remaining bid-side >=10% sell. Stale shortlist exhaustion alone is not enough. Do not start DD work while a known qualifying sell candidate remains and Lane 1 time remains. If Lane 1 sell work is exhausted before `launch_time + 14:59`, use the remaining Lane 1 time for plausible DD verification and execute exact due DDs, but switch to Lane 2 at `launch_time + 15:00`.

Lane 2 DD-first procedure: read `data/private/top-10-buy-candidates.md` first and quote those DD-proximity symbols against live Robinhood data. Then run exact DD reconstruction from fresh positions, active orders, quotes, and filled buy/order history. Execute all due DDs one symbol at a time until no exact due DD remains, buying power/concentration/broker/tool blockers prevent the rest, or Lane 2 time expires. DD orders use combined same-symbol due lot shares, not rounded dollars. During regular market hours, an exact due DD remains executable even when `integer_qty=0` if Robinhood accepts the fractional buy. If Robinhood rejects the fractional DD quantity, retry the integer part only when `integer_qty >= 1`; if the integer part is 0 after rejection, report it as a broker-blocked exact fractional DD, not a coverage blocker. `data/runtime/dd-fractional-leftovers.csv` is only for decimal remainders after an integer-share execution or integer fallback. A DD is executable only when fresh ask is at or below the deepest included trigger. After placing a DD, check broker returned `price` or `average_price`; if an active order is missing price or above the deepest trigger, cancel and report the guard action. The 15% cash floor blocks openings and reopens, but it must not block due exact-share DDs; DD affordability uses actual buying power plus concentration and broker checks.

If DD coverage cannot be proven after required fallback verification, report `DD SCAN BLOCKED`, email `rdgustave@gmail.com` with subject `DOUBLE-DOWN SCAN BLOCKED - Robinhood strategy`, and list exact blockers. If DD is exhausted or blocked before `launch_time + 30:00`, use remaining Lane 2 time for sell/reopen work using the Lane 1 sell procedure.

Shortlists and closeout: top-10 files are speed hints, not trading authority. This slot must consume them first, but every action still requires fresh broker truth. At closeout, if no executable sell/DD is waiting for immediate action and enough time remains, refresh `data/private/top-10-buy-candidates.md` from the latest broker-backed DD scan/order-history reconstruction and refresh `data/private/top-10-sell-candidates.md` from the latest broker-backed positions and quotes. Do not let shortlist writes delay a qualifying order. Write slot memory with lane timing, sells/reopens, DDs, blockers, and whether shortlists were refreshed or intentionally skipped.
'''
