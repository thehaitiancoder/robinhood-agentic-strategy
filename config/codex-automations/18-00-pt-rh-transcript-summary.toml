prompt = "Hard Pacific-time gate first. This is the 18:00 PT market-day Robinhood transcript recap lane. Run only at or after 18:00 Pacific on the current Pacific date; if started outside that window, write a concise late/early skip note if possible and stop before reading docs or calling tools for strategy work.\n\nAfter the hard time gate and before reading docs, run the local market calendar gate from the repo root: `python -m agentic_strategy.market_calendar --date today --calendar config/market-holidays.csv --market US_EQUITIES`. If it reports `market_status=closed`, write a concise `MARKET HOLIDAY SKIP` note if possible and stop.\n\nStart the first visible response with `MM-DD 18:00 PT - RH TRANSCRIPT SUMMARY`. Read `AGENTS.md` and `docs/automation-monitor.md` after the gates.\n\nThis automation is read-only reporting. Do not call Robinhood broker review/place/cancel tools, do not place or suggest orders, and do not modify trading state. Do not send email for any outcome; record routine summaries and attention-needed issues in the task transcript and automation memory only.\n\nAudit today's Codex automation transcripts for the current Pacific date. The goal is to judge whether each automation did its job accurately, not merely restate performance files. Do not use broad Codex `list_threads` discovery. Do not search or read archived sessions; today's automation threads are not expected to be archived.\n\nPrimary source of truth for transcripts: local JSONL files under `C:\\Users\\ralph\\.codex\\sessions\\YYYY\\MM\\DD\\rollout-*.jsonl`, where `YYYY\\MM\\DD` is the current Pacific date. Filter to this repo cwd and automation-originated runs. Identify each transcript by its automation user prompt/title, especially `Automation ID:`. Expected automation ids to cover: `04-00-pt-rh-pre`, `05-00-pt-rh-pre`, `06-00-pt-rh-pre`, `06-30-pt-rh-mkt`, `07-00-pt-rh-mkt`, `07-30-pt-rh-mkt`, `08-00-pt-rh-mkt`, `08-30-pt-rh-mkt`, `09-00-pt-rh-mkt`, `09-30-pt-rh-mkt`, `10-00-pt-rh-mkt`, `10-30-pt-rh-mkt`, `11-00-pt-rh-mkt`, `11-30-pt-rh-mkt`, `12-00-pt-rh-mkt`, `12-30-pt-rh-mkt`, `12-45-pt-sauce`, `13-00-pt-rh-ah`, `14-00-pt-rh-ah`, `15-00-pt-rh-ah`, `16-00-pt-rh-ah`, and `17-00-pt-rh-daily-summary`.\n\nUse local automation memory files under `C:\\Users\\ralph\\.codex\\automations\\*\\memory.md` only as a cross-check and compact index, not as a substitute for transcript audit. If a same-day transcript is missing, report that transcript as missing and use that slot's same-day memory only as an explicitly labeled fallback. Do not hang or broaden discovery to find it.\n\nKeep extraction efficient. First inventory same-day `rollout-*.jsonl` files by name, size, mtime, cwd, thread source, title/prompt, and automation id. Then inspect only targeted transcript evidence: final answer, broker/order-related tool calls and outputs, file changes, command failures, unexpected email attempts, guard exceptions, `DD SCAN BLOCKED` labels, blocked sell/DD labels, and memory writes. Use `rg`, `Select-String`, or small PowerShell JSONL filters instead of loading whole large transcripts into context. If a specific same-day thread id is embedded in local evidence and the local JSONL transcript is missing, you may read that specific thread only; otherwise do not use Codex thread tools.\n\nReport by lane and keep it concise but operationally useful. Include filled sells, filled DD buys, reopens queued or filled, blocked sell/DD actions, guard exceptions, helper/tool failures, unexpected email attempts, important file/artifact updates, end-state cash/account metrics from the 17:00 daily transcript when available, and next-session watch items. Call out unusual issues separately, especially any slot that skipped required sell/DD work, used stale data, failed to follow the priority contract, or produced a misleading final report. Append a short memory note for this automation with headline metrics, transcript coverage status, runtime, and follow-up items."
