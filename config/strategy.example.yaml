# Example strategy configuration. Confirmed strategy decisions are documented in
# docs/decisions.md.

account:
  nickname: Agentic
  account_number_mask: "****7701"
  account_type_expected: cash

portfolio_rules:
  cash_buffer_pct: 0.10
  max_single_position_pct: 0.10
  profit_take_pct: 0.10
  emergency_sell_min_return_pct: 0.00
  emergency_green_sell_ranking: highest_positive_return

position_opening:
  initial_base_usd: 1.00
  base_increment_usd: 1.00
  increment_base_after_full_universe_coverage: true
  # There is no share-price cap for new openings. Stocks at or above $1 use
  # dollar-based fractional sizing; sub-dollar stocks use whole-share quantity
  # sizing that fits within the target lot dollars.
  require_no_due_double_downs: true
  require_cash_buffer_after_order: true

lot_ladder:
  lot_share_multiplier: 2.0
  fractional_dollar_sizing_min_price: 1.00
  sub_dollar_sizing: whole_share_floor_to_target_notional
  sub_dollar_min_whole_shares: 1
  repeat_final_drop_zone_indefinitely: true
  trigger_zones:
    # Lot 1 is the initial open. These ranges describe the drop required from
    # the previous trigger price before adding the next lot.
    - next_lot_range: [2, 5]
      drop_from_previous_trigger_pct: 0.10
      buys_in_zone: 4
    - next_lot_range: [6, 10]
      drop_from_previous_trigger_pct: 0.20
      buys_in_zone: 5
    - next_lot_range: [11, 15]
      drop_from_previous_trigger_pct: 0.40
      buys_in_zone: 5
    - next_lot_range: [16, null]
      drop_from_previous_trigger_pct: 0.80
      buys_in_zone: 5
      repeat_indefinitely: true

execution:
  regular_hours_only_for_fractional_market_orders: true
  automatic_market_execution_when_criteria_met: true
  execution_style: market
  # Open/reopen orders may use dollar sizing, but DD orders must be placed by
  # exact share quantity: broker quantity = next_lot_shares.
  order_sizing_for_double_down: exact_lot_share_quantity
  sell_scan_priority: highest
  buy_scan_priority: after_sells_and_double_downs
  broker_tool_confirmation_policy: obey_runtime_tool_requirements
  order_type_for_open: market
  order_type_for_reopen: market
  order_type_for_double_down: market
  order_type_for_target_sell: market
  order_type_for_emergency_sell: market
  use_limit_orders: false
  use_gtc_target_orders: false

universe:
  source: data/universe.csv
  source_policy: local_robinhood_validated_incremental
  require_robinhood_tradable: true
  require_fractional_eligible_for_dollar_orders_at_or_above_1_usd: true
  allow_sub_dollar_whole_share_orders_without_fractional_eligibility: true
  exclude_halted_or_delisted: true
